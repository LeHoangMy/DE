version: 2

models:
  - name: fact_sales_order
    description: "Successful orders. Grain: 1 row = 1 product line item per order"
    columns:
      - name: order_id
        description: "Order ID. Multiple rows may share the same order_id when cart has multiple products"
        tests:
          - not_null
      - name: customer_key
        description: "FK to dim_customer. -1 indicates guest checkout (no user_id)"
        tests:
          - not_null
      - name: device_key
        description: "FK to dim_device"
        tests:
          - not_null
      - name: product_key
        description: "FK to dim_product"
        tests:
          - not_null
      - name: date_key
        description: "FK to dim_date, format YYYYMMDD"
        tests:
          - not_null
      - name: price
        description: "Product price, normalized from European format (e.g. 1.234,56 to 1234.56)"
      - name: currency
        description: "ISO currency code: EUR, USD, GBP, etc."
      - name: option_1_key
        description: "FK to dim_option, first product option"
      - name: option_2_key
        description: "FK to dim_option, second product option (nullable)"
